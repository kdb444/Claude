<title>Schoolwork Calendar</title>
<style>
/* layout: quick-add + month grid left; selected day, due soon, courses right; stacks on phones */
:root{color-scheme:light;--bg:#f7f8fb;--panel:#fff;--fg:#1c2230;--mute:#667085;--line:#e6e9f0;--accent:#2f5bea;--on-accent:#fff;--today:#eef3ff;--sel:#2f5bea;--bad:#c4321f;--sat:62%;--lit:42%;
--display:"Fraunces",Georgia,serif;--body:"IBM Plex Sans",system-ui,sans-serif}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);padding-inline:16px;padding-block:20px}
*{box-sizing:border-box}
main{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px 20px;align-items:start}
@media(max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
h1{font:600 28px var(--display);margin:0;text-wrap:balance}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.nav{display:flex;gap:6px;align-items:center}
button,input,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
button{cursor:pointer;transition:border-color .12s,background .12s}button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
button.ghost{border-color:transparent;background:none;color:var(--mute);padding:2px 8px}button.ghost:hover{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.mo{font:600 18px var(--display);min-width:16ch;text-align:center}
#qa{width:100%;font-size:16px;padding:10px 12px}
.hint{color:var(--mute);font-size:12px;margin:6px 2px 0}.hint code{background:var(--bg);padding:0 4px;border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dow{background:var(--panel);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:6px;text-align:center}
.day{background:var(--panel);min-height:280px;padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer;outline-offset:-2px}
.day:hover{background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
.day.out{opacity:.5}.day.today{background:var(--today)}
.day.sel{box-shadow:inset 0 0 0 2px var(--sel)}.day.drop{background:color-mix(in srgb,var(--accent) 22%,var(--panel))}
.day b{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;align-self:flex-start;padding:0 4px;border-radius:9px}
.day.today b{background:var(--accent);color:var(--on-accent)}
.chip{font-size:11px;line-height:1.3;padding:1px 4px;border-radius:3px;overflow-wrap:anywhere;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);cursor:grab}
.chip.done{text-decoration:line-through;opacity:.45}.chip.late{box-shadow:inset 0 -2px 0 var(--bad)}.chip.exam{font-weight:600}
.more{font-size:11px;color:var(--mute);padding-left:4px}
@media(max-width:700px){.grid{grid-template-columns:minmax(0,1fr)}.day{min-height:0}}
h2{font:600 16px var(--display);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font:400 12px var(--body);color:var(--mute)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
li{display:flex;gap:8px;align-items:flex-start;border-left:3px solid var(--c);padding:5px 4px 5px 8px;border-radius:0 6px 6px 0;cursor:pointer}
li:hover{background:var(--bg)}
li input{margin-top:4px;flex:none}
li .t{flex:1;min-width:0;overflow-wrap:anywhere}li small{display:block;color:var(--mute)}
li.done .t{text-decoration:line-through;opacity:.5}
.late{color:var(--bad)}.stat{display:flex;gap:18px;margin-bottom:12px;font-variant-numeric:tabular-nums}.stat span{color:var(--mute);font-size:12px;display:block}
.stat strong{font:600 22px var(--display)}
.empty{color:var(--mute);padding:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend button{display:flex;gap:6px;align-items:center;padding:3px 10px;border-radius:99px;font-size:13px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}.legend button.off{opacity:.4;text-decoration:line-through}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:18px;width:min(380px,calc(100vw - 32px))}
dialog::backdrop{background:rgb(0 0 0/.4)}
dialog form{display:grid;gap:10px}dialog label{display:grid;gap:3px;font-size:12px;color:var(--mute)}
dialog label input,dialog label select{font-size:15px;color:var(--fg)}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 8px 8px 14px;border-radius:8px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 24px rgb(0 0 0/.25);max-width:calc(100vw - 32px)}
.toast button{background:none;color:inherit;border-color:currentColor;padding:2px 10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">

<main>
<header>
  <h1>Schoolwork Calendar</h1>
  <div class="nav">
    <button id="prev" aria-label="Previous week">‹</button>
    <span class="mo" id="mo" aria-live="polite"></span>
    <button id="next" aria-label="Next week">›</button>
    <button id="now">Today</button>
  </div>
</header>

<div class="col">
  <section class="panel">
    <input id="qa" autocomplete="off" aria-label="Quick add" placeholder="Add work…  e.g. Lab report @bio_201 !exam fri">
    <p class="hint" id="hint"></p>
  </section>
  <section class="panel"><div class="grid" id="grid" role="grid"></div></section>
</div>

<aside class="col">
  <section class="panel"><h2 id="dh"></h2><ul id="day"></ul></section>
  <section class="panel">
    <div class="stat" id="stat"></div>
    <h2>Due soon</h2>
    <ul id="soon"></ul>
  </section>
  <section class="panel" id="lp" hidden><h2>Courses <small>click to hide</small></h2><div class="legend" id="legend"></div></section>
</aside>
</main>

<dialog id="dlg">
  <form id="ef" method="dialog">
    <label>Title<input id="e_title" required></label>
    <label>Course<input id="e_course" list="courses" required></label>
    <datalist id="courses"></datalist>
    <label>Due<input id="e_date" type="date" required></label>
    <label>Type<select id="e_type"></select></label>
    <label class="row" style="justify-content:flex-start;gap:8px;color:var(--fg)"><input id="e_done" type="checkbox"> Done</label>
    <div class="row">
      <button type="button" id="e_del" class="ghost">Delete</button>
      <span><button value="cancel" formnovalidate>Cancel</button> <button class="primary" value="save">Save</button></span>
    </div>
  </form>
</dialog>
<div class="toast" id="toast" hidden><span id="tmsg"></span><button id="undo">Undo</button></div>

<script>
const $=id=>document.getElementById(id);
const TYPES=["Assignment","Exam","Project","Reading","Quiz"], DOWS=["sun","mon","tue","wed","thu","fri","sat"];
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fromIso=s=>new Date(s+"T00:00");
const addDays=(s,n)=>{const d=fromIso(s);d.setDate(d.getDate()+n);return iso(d)};
const todayIso=iso(new Date());
const pretty=s=>fromIso(s).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
let items=[], view=new Date(), sel=todayIso, hide=new Set();

// Storage: shared db when available, else localStorage (no cross-device sync in the fallback)
let db=null;
const LS="schoolwork-items";
const load=()=>{try{return JSON.parse(localStorage.getItem(LS))||[]}catch{return[]}};
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(items))}catch{}};
async function put(it){
  if(db){ await db.collection("items").doc(it.id).set(it).catch(e=>say("Could not save: "+(e.message||e.code))); }
  else{ items=items.filter(x=>x.id!==it.id).concat(it); save(); render(); }
}
async function del(id){
  if(db){ await db.collection("items").doc(id).delete().catch(e=>say("Could not delete: "+(e.message||e.code))); }
  else{ items=items.filter(x=>x.id!==id); save(); render(); }
}

// Toast with a single-level undo
let tt;
function say(msg,undo){ clearTimeout(tt); $("tmsg").textContent=msg; $("undo").hidden=!undo; $("undo").onclick=()=>{undo();$("toast").hidden=true}; $("toast").hidden=false; tt=setTimeout(()=>$("toast").hidden=true,5000); }
const setDone=(it,done)=>{ put({...it,done}); say(done?"Marked done":"Marked not done",()=>put(it)); };
const remove=it=>{ del(it.id); say("Deleted “"+it.title+"”",()=>put(it)); };
const move=(it,date)=>{ if(it.date===date)return; put({...it,date}); say("Moved to "+pretty(date),()=>put(it)); };

// Course colour: stable hue from name; lightness comes from the theme token
const colour=c=>{let h=0;for(const ch of c)h=(h*31+ch.charCodeAt(0))%360;return`hsl(${h} var(--sat) var(--lit))`};

// ---- quick add: "Title words @course_name !type date"; date = today|tmr|fri|10/24|2026-10-24 (last word only)
function pdate(w){
  w=w.toLowerCase();
  if(w==="today")return todayIso; if(w==="tomorrow"||w==="tmr")return addDays(todayIso,1);
  if(/^\d{4}-\d{2}-\d{2}$/.test(w))return w;
  let m=w.match(/^(\d{1,2})\/(\d{1,2})$/);
  if(m){let d=new Date(new Date().getFullYear(),m[1]-1,+m[2]); if(iso(d)<addDays(todayIso,-30))d.setFullYear(d.getFullYear()+1); return iso(d);}
  m=w.match(/^(sun|mon|tue|wed|thu|fri|sat)[a-z]*$/);
  if(m)return addDays(todayIso,((DOWS.indexOf(m[1])-new Date().getDay()+6)%7)+1);
}
function parse(line){
  const w=line.trim().split(/\s+/).filter(Boolean); let course,type="Assignment",date=sel;
  const d=w.length>1&&pdate(w[w.length-1]); if(d){date=d;w.pop();}
  const title=[];
  for(const x of w){
    if(x[0]==="@"&&x.length>1)course=x.slice(1).replace(/_/g," ");
    else if(x[0]==="!"&&TYPES.find(t=>t.toLowerCase().startsWith(x.slice(1).toLowerCase())))type=TYPES.find(t=>t.toLowerCase().startsWith(x.slice(1).toLowerCase()));
    else title.push(x);
  }
  if(!title.length)return null;
  if(!course){try{course=localStorage.getItem("last-course")}catch{} course=course||"General";}
  return{id:"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),title:title.join(" "),course,date,type,done:false};
}
function addLines(text){
  const made=text.split("\n").map(parse).filter(Boolean);
  made.forEach(put);
  if(made.length){ try{localStorage.setItem("last-course",made[made.length-1].course)}catch{} sel=made[0].date; view=fromIso(sel);
    say(made.length===1?`Added “${made[0].title}” · ${pretty(made[0].date)}`:`Added ${made.length} items`,()=>made.forEach(x=>del(x.id))); render(); }
}
$("qa").addEventListener("keydown",e=>{ if(e.key==="Enter"&&$("qa").value.trim()){addLines($("qa").value);$("qa").value="";hint();} });
$("qa").addEventListener("paste",e=>{ const t=e.clipboardData.getData("text"); if(t.includes("\n")){e.preventDefault();addLines(t);} });
$("qa").addEventListener("input",hint);
function hint(){
  const p=parse($("qa").value);
  $("hint").innerHTML=p?`→ <b>${esc(p.title)}</b> · ${esc(p.course)} · ${p.type} · ${pretty(p.date)}`:`Press Enter to add to <b>${pretty(sel)}</b>. Use <code>@course</code> <code>!exam</code> and end with <code>fri</code>, <code>10/24</code> or <code>tmr</code>. Paste several lines to add many.`;
}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---- edit dialog
$("e_type").innerHTML=TYPES.map(t=>`<option>${t}</option>`).join("");
let editing=null;
function edit(it){ editing=it; $("e_title").value=it.title;$("e_course").value=it.course;$("e_date").value=it.date;$("e_type").value=it.type;$("e_done").checked=!!it.done; $("dlg").showModal(); }
$("dlg").addEventListener("close",()=>{
  if($("dlg").returnValue==="save"&&editing){ const n={...editing,title:$("e_title").value.trim(),course:$("e_course").value.trim(),date:$("e_date").value,type:$("e_type").value,done:$("e_done").checked}; put(n); sel=n.date; say("Saved",()=>put(editing)); }
  editing=null;
});
$("e_del").onclick=()=>{ const it=editing; editing=null; $("dlg").close(); remove(it); };

// ---- rendering
const h=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const vis=()=>items.filter(x=>!hide.has(x.course));
const sortF=(a,b)=>a.date.localeCompare(b.date)||a.title.localeCompare(b.title);

function chip(it){
  const e=h("div","chip"+(it.done?" done":"")+(it.type==="Exam"?" exam":"")+(!it.done&&it.date<todayIso?" late":""),(it.type==="Exam"?"★ ":"")+it.title);
  e.style.setProperty("--c",colour(it.course)); e.title=`${it.course} · ${it.type}${it.done?" · done":""}`;
  e.draggable=true; e.ondragstart=ev=>{ev.dataTransfer.setData("text/plain",it.id);ev.dataTransfer.effectAllowed="move"};
  e.onclick=ev=>{ev.stopPropagation();edit(it)};
  return e;
}
function row(it,withDate){
  const li=h("li",it.done?"done":""); li.style.setProperty("--c",colour(it.course));
  const cb=h("input"); cb.type="checkbox"; cb.checked=!!it.done; cb.setAttribute("aria-label","Done"); cb.onclick=e=>e.stopPropagation(); cb.onchange=()=>setDone(it,cb.checked);
  const t=h("div","t",it.title), s=h("small");
  let when="";
  if(withDate){const n=Math.round((fromIso(it.date)-fromIso(todayIso))/864e5); when=n<0?`${-n}d overdue`:n===0?"today":n===1?"tomorrow":`in ${n}d`;}
  s.append(`${it.course} · ${it.type}`); if(when){s.append(" · ");const w=h("span",it.date<todayIso?"late":"",when);s.append(w);}
  t.append(s); li.append(cb,t); li.onclick=()=>edit(it); return li;
}
function render(){
  const start=new Date(view); start.setDate(start.getDate()-start.getDay());
  const end=new Date(start); end.setDate(start.getDate()+6);
  $("mo").textContent=start.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" – "+end.toLocaleDateString(undefined,start.getMonth()===end.getMonth()?{day:"numeric",year:"numeric"}:{month:"short",day:"numeric",year:"numeric"});
  const shown=vis(), g=$("grid"); g.replaceChildren();
  for(let i=0;i<7;i++){
    const d=new Date(start); d.setDate(start.getDate()+i); const k=iso(d);
    const c=h("div","day"+(k===todayIso?" today":"")+(k===sel?" sel":""));
    c.tabIndex=0; c.setAttribute("role","gridcell"); c.setAttribute("aria-label",pretty(k));
    c.append(h("b","",d.toLocaleDateString(undefined,{weekday:"short"})+" "+d.getDate()));
    shown.filter(x=>x.date===k).sort(sortF).forEach(x=>c.append(chip(x)));
    const pick=()=>{sel=k;render();hint();};
    c.onclick=pick; c.onkeydown=e=>{if(e.key==="Enter"){pick();$("qa").focus()}};
    c.ondragover=e=>{e.preventDefault();c.classList.add("drop")}; c.ondragleave=()=>c.classList.remove("drop");
    c.ondrop=e=>{e.preventDefault();const it=items.find(x=>x.id===e.dataTransfer.getData("text/plain"));if(it){sel=k;move(it,k)}};
    g.append(c);
  }
  // selected day
  $("dh").replaceChildren(sel===todayIso?"Today":pretty(sel),h("small","",sel===todayIso?pretty(sel):""));
  const dl=$("day"); dl.replaceChildren();
  const here=shown.filter(x=>x.date===sel).sort(sortF);
  if(!here.length)dl.append(h("li","empty","Nothing due. Type in the box above to add something.")), dl.lastChild.style.cssText="border:0;cursor:default";
  here.forEach(x=>dl.append(row(x)));
  // due soon
  const open=shown.filter(x=>!x.done).sort(sortF), wk=addDays(todayIso,7);
  $("stat").replaceChildren();
  for(const[n,l,bad]of[[open.filter(x=>x.date<todayIso).length,"overdue",1],[open.filter(x=>x.date>=todayIso&&x.date<=wk).length,"next 7 days"],[shown.filter(x=>x.done).length+"/"+shown.length,"done"]]){
    const d=h("div"),s=h("strong",bad&&n?"late":"",n);d.append(s,h("span","",l));$("stat").append(d);
  }
  const s=$("soon"); s.replaceChildren();
  if(!open.length){ const e=h("li","empty",items.length?"Everything is done.":"Nothing yet. Add your first assignment above."); e.style.cssText="border:0;cursor:default"; s.append(e); }
  open.slice(0,8).forEach(x=>s.append(row(x,true)));
  // courses
  const cs=[...new Set(items.map(x=>x.course))].sort();
  $("lp").hidden=cs.length<2;
  $("legend").replaceChildren(...cs.map(c=>{const b=h("button",hide.has(c)?"off":"");b.style.setProperty("--c",colour(c));b.append(h("i"),c);b.onclick=()=>{hide.has(c)?hide.delete(c):hide.add(c);render()};return b}));
  $("courses").replaceChildren(...cs.map(c=>{const o=h("option");o.value=c;return o}));
}

// ---- navigation + shortcuts
const go=n=>{view.setDate(view.getDate()+7*n);render()};
$("prev").onclick=()=>go(-1); $("next").onclick=()=>go(1);
$("now").onclick=()=>{view=new Date();sel=todayIso;render();hint();$("qa").focus()};
addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)||$("dlg").open)return;
  if(e.key==="/"){e.preventDefault();$("qa").focus()} else if(e.key==="ArrowLeft")go(-1); else if(e.key==="ArrowRight")go(1); else if(e.key==="t")$("now").click();
});

items=load(); render(); hint();
(async()=>{
  const d=await window.claude?.use("db"); if(!d)return;
  db=d; d.collection("items").onSnapshot(s=>{items=s.docs.map(x=>x.data());render()},()=>{db=null;items=load();render()});
})();
</script>
