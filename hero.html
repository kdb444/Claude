<!doctype html>
<meta charset="utf-8">
<title>Hero</title>
<style>
  /* ponytail: change COLS/ROWS/--dur/--hold to taste */
  :root { --cols: 16; --rows: 9; --dur: 1.2s; --step: 0.07s; --cycle: 9s; }
  html, body { margin: 0; height: 100%; background: #000; }
  .hero { background: #2a0f1c; position: relative; width: 100vw; aspect-ratio: 16/9; max-height: 100vh; overflow: hidden;
          display: grid; grid-template: repeat(var(--rows), 1fr) / repeat(var(--cols), 1fr); }
  .t { position: relative; transform-style: preserve-3d; animation: flip var(--cycle) infinite ease-in-out;
       animation-delay: calc((var(--c) + var(--r)) * var(--step)); }
  .t::before, .t::after { content: ""; position: absolute; inset: -0.5px; backface-visibility: hidden;
       background-size: calc(var(--cols) * 100%) calc(var(--rows) * 100%);
       background-position: calc(var(--c) * 100% / (var(--cols) - 1)) calc(var(--r) * 100% / (var(--rows) - 1)); }
  .t::before { background-image: url(green.jpg); }
  .t::after  { background-image: url(pink.jpg); transform: rotateY(180deg); }
  /* green -> hold pink -> back to green -> hold green; diagonal delay makes the wave */
  @keyframes flip {
    0%, 8%   { transform: rotateY(0); }
    16%, 58% { transform: rotateY(180deg); }
    66%, 100% { transform: rotateY(360deg); }
  }
</style>
<div class="hero" id="h"></div>
<script>
  const h = document.getElementById('h'), cs = getComputedStyle(document.documentElement);
  const C = +cs.getPropertyValue('--cols'), R = +cs.getPropertyValue('--rows');
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++)
    h.insertAdjacentHTML('beforeend', `<div class="t" style="--c:${c};--r:${r}"></div>`);
</script>
